<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Header (alternative): logo table with band</title>
    <link rel="stylesheet" href="banner-thread.css" />
    <style>
      body {
        background: #24162e;
      }
      /* The store marquee, nudged up to make room for the band */
      .table {
        position: absolute;
        left: 0;
        top: -100px;
        width: 1400px;
        height: 560px;
        background: url("banner-marquee.png") no-repeat;
      }
      .band {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 104px;
        background: linear-gradient(#2f1d3c, #22152c);
        border-top: 4px solid #8a5bb0;
        box-shadow: 0 -10px 24px rgba(0, 0, 0, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 46px;
      }
      .item {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .ico {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: #4b2e5f;
        border: 2px solid #8a5bb0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        line-height: 1;
        color: #fff;
      }
      .ico.mono {
        font-family: Consolas, monospace;
        font-size: 20px;
        font-weight: 700;
      }
      .item b {
        display: block;
        font-size: 24px;
        font-weight: 800;
      }
      .item small {
        display: block;
        font-size: 15px;
        color: #cdbfd8;
        font-weight: 600;
      }
      .sep {
        width: 2px;
        height: 50px;
        background: #4b2e5f;
      }
      .ver {
        font-size: 22px;
        padding: 6px 16px;
        border-radius: 18px;
      }
    </style>
  </head>
  <body>
    <div class="table"></div>
    <div class="band">
      <div class="item">
        <span class="ico">♠</span>
        <div><b>Blackjack</b><small>Strategy Assistant and stats</small></div>
      </div>
      <div class="item">
        <span class="ico">🍒</span>
        <div><b>Slots</b><small>Auto-spin bot with limits</small></div>
      </div>
      <div class="item">
        <span class="ico mono">&gt;_</span>
        <div><b>Hack Game</b><small>Status card on every HF page</small></div>
      </div>
      <span class="sep"></span>
      <span class="chip ver">v2.0</span>
    </div>
  </body>
</html>
